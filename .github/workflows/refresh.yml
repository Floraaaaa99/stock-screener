name: Refresh full universe

# Builds the full NASDAQ / NYSE / NYSE American dataset. Never deploys GitHub Pages.
# The live site stays as committed in web/public/data/ until a complete run passes
# the publish gate and is copied with --write-live. Weekly cron is intentionally omitted.
on:
  workflow_dispatch:
    inputs:
      universe:
        description: Dataset to build
        type: choice
        options:
          - full
          - sample:biotech20
        default: full
      time_budget_hours:
        description: Stop and save state after this many hours
        type: string
        default: "5"

permissions:
  contents: read

concurrency:
  group: refresh-universe
  cancel-in-progress: false

jobs:
  refresh:
    name: Build dataset
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      SCREENER_STATE_DIR: ${{ github.workspace }}/pipeline/.cache/state
      SCREENER_OUTPUT_DIR: ${{ github.workspace }}/pipeline/.cache/dataset
    steps:
      - uses: actions/checkout@v7
      - name: Require SEC_USER_AGENT
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add the SEC_USER_AGENT repository secret (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline"
      - uses: actions/cache@v6
        with:
          path: |
            pipeline/.cache/nasdaq
            pipeline/.cache/sec/bulk
            pipeline/.cache/sec/company_tickers_exchange.json
          key: pipeline-hot-${{ github.run_id }}
          restore-keys: pipeline-hot-
      - name: Restore compact state from the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release download pipeline-state --pattern "state.tar.gz" --pattern "state.tar.gz.sha256" --dir /tmp/pipeline-state
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "No pipeline-state release yet; starting from empty state."
            exit 0
          fi
          screener unpack-state --archive /tmp/pipeline-state/state.tar.gz --dest "$SCREENER_STATE_DIR" --sha256-file /tmp/pipeline-state/state.tar.gz.sha256
      - name: Build
        id: build
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          set +e
          screener -v build --universe "${{ inputs.universe }}" --time-budget-hours "${{ inputs.time_budget_hours }}" --report docs/validation/refresh-report.md
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            exit 0
          fi
          exit "$code"
      - name: Pack state
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/pipeline/.cache/state-out"
          if [ -d "$SCREENER_STATE_DIR/facts" ]; then
            dest="$GITHUB_WORKSPACE/pipeline/.cache/state-out"
            screener pack-state --state-dir "$SCREENER_STATE_DIR" --dest "$dest/state-${{ github.run_id }}.tar.gz"
            cp "$dest/state-${{ github.run_id }}.tar.gz" "$dest/state.tar.gz"
            cp "$dest/state-${{ github.run_id }}.tar.gz.sha256" "$dest/state.tar.gz.sha256"
            screener unpack-state --archive "$dest/state.tar.gz" --dest "$GITHUB_WORKSPACE/pipeline/.cache/state-verify" --sha256-file "$dest/state.tar.gz.sha256"
          else
            echo "No compact facts to pack."
          fi
      - name: Upload state to the rolling release
        if: always() && hashFiles('pipeline/.cache/state-out/state.tar.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view pipeline-state >/dev/null 2>&1; then
            gh release create pipeline-state --title "Pipeline state" --notes "Compact SEC facts, SIC records, and cached statements. See docs/stage2-persistence.md."
          fi
          # Dated asset first so a failed pointer update is recoverable.
          dest="$GITHUB_WORKSPACE/pipeline/.cache/state-out"
          gh release upload pipeline-state "$dest/state-${{ github.run_id }}.tar.gz" "$dest/state-${{ github.run_id }}.tar.gz.sha256" --clobber
          gh release download pipeline-state --pattern "state-${{ github.run_id }}.tar.gz" --dir /tmp/state-check
          expected=$(cut -d ' ' -f1 "$dest/state-${{ github.run_id }}.tar.gz.sha256")
          got=$(sha256sum /tmp/state-check/state-${{ github.run_id }}.tar.gz | cut -d ' ' -f1)
          if [ "$expected" != "$got" ]; then
            echo "::error::Uploaded state failed the checksum round-trip."
            exit 1
          fi
          gh release upload pipeline-state "$dest/state.tar.gz" "$dest/state.tar.gz.sha256" --clobber
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dataset
          path: |
            pipeline/.cache/dataset
            pipeline/.cache/state/dataset-full
            docs/validation/refresh-report.md
          retention-days: 90
          if-no-files-found: warn
      - name: Validation gate (does not publish)
        if: steps.build.outputs.exit_code == '0'
        run: |
          meta=pipeline/.cache/dataset/meta.json
          if [ ! -f "$meta" ] && [ -f pipeline/.cache/state/dataset-full/meta.json ]; then
            meta=pipeline/.cache/state/dataset-full/meta.json
          fi
          screener gate --meta "$meta"
          echo "Non-publish validation passed. GitHub Pages was not updated."
          screener gate --meta "$meta" --publish || echo "Publish gate not yet satisfied; live Pages unchanged."
      - name: Fail incomplete runs
        if: steps.build.outputs.exit_code == '3'
        run: |
          echo "::error::Run is incomplete (time budget). State was saved; re-run this workflow to resume. Nothing was published."
          exit 1
