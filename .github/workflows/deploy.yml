name: Deploy to GitHub Pages

# Deploys the committed dataset. Full-universe payloads are refused until the
# publish gate on that dataset passes. The live site stays on the last validated
# sample until a complete full run is copied in. No weekly schedule.
#
# Daily incremental updates (daily-update.yml) deploy Pages in the same workflow.
# GITHUB_TOKEN commits do not retrigger this file; [skip pages] is an extra guard
# if a PAT is used later.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh the Stage 1 sample from the live sources before deploying
        type: boolean
        default: false
      universe:
        description: Dataset to build (sample only; full universe is refresh.yml)
        type: choice
        options:
          - sample:biotech20
        default: sample:biotech20

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh dataset
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # The secret is passed only to the steps that need it and is never echoed.
      - name: Require SEC_USER_AGENT
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add the SEC_USER_AGENT repository secret (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e "pipeline"
      # Speeds up reruns only; the pipeline re-downloads anything missing or stale.
      - uses: actions/cache@v6
        with:
          path: pipeline/.cache
          key: pipeline-cache-${{ inputs.universe }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ inputs.universe }}-
      - name: Build dataset
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: screener -v build --universe "${{ inputs.universe }}" --report docs/validation/refresh-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: dataset
          path: |
            web/public/data
            docs/validation/refresh-report.md
          retention-days: 90

  build:
    name: Build site
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip pages]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use refreshed dataset
        if: needs.refresh.result == 'success'
        run: rm -rf web/public/data
      - uses: actions/download-artifact@v8
        if: needs.refresh.result == 'success'
        with:
          name: dataset
          path: .
      - name: Refuse an unpublished full-universe dataset
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("web/public/data/meta.json")
          meta = json.loads(p.read_text())
          mode = (meta.get("dataset") or {}).get("mode")
          gate = meta.get("gate") or {}
          if mode == "sample":
              sys.exit(0)
          if mode == "full" and gate.get("ok"):
              print("Full-universe dataset passed the publish gate.")
              sys.exit(0)
          print(
              f"::error::Pages deploy requires dataset.mode=sample, or full with gate.ok "
              f"(got mode={mode!r} gate={gate}). Live Pages stays on the last validated sample."
          )
          sys.exit(1)
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm test
      - uses: actions/configure-pages@v6
        id: pages
      - working-directory: web
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
